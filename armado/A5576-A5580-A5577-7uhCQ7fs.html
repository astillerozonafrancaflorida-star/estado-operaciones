<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Armado</title>
<style>
:root{--bg:#F2F3EF;--sf:#fff;--fg:#1A211D;--mu:#5E6862;--ln:#D9DDD6;--ac:#7A1F3D;--ok:#2F7A3F;--oks:#E1F0E3;--wa:#9A6400;--was:#FBEFD6;--bad:#B3261E;--bads:#F9E0DE}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left)) 130px;display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;margin:0;line-height:1.1}
h2{font-size:19px;margin:0}
.eb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.mu{color:var(--mu);font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.who{display:flex;gap:8px;align-items:center}
.who input{flex:1;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:var(--sf)}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog .n{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.prog .l{font-size:12px;color:var(--mu)}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--ln);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln)}
.tabs button{background:none;border:0;padding:10px 12px;font-weight:700;color:var(--mu);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--fg);border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.ln{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left}
.ln.ok{border-color:var(--ok);border-left-color:var(--ok);background:#CFEBD4}.ln.ok .nm{color:#1D5A2A}.ln.ok .meta{color:#2F5E39}.ln.par{border-left-color:var(--wa)}.ln.exc{border-left-color:var(--bad)}
.ln .nm{font-weight:700;font-size:14px;line-height:1.25}
.ln .meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.loc{background:#1A211D;color:#fff;border-radius:5px;padding:1px 6px;font-weight:700}
.ln .q{text-align:right;font-size:22px;font-weight:800;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln .q small{display:block;font-size:11px;font-weight:700;margin-top:4px}
.s-ok{color:var(--ok)}.s-par{color:var(--wa)}.s-exc{color:var(--bad)}.s-pen{color:var(--mu)}
.empty{border:1px dashed var(--ln);border-radius:12px;padding:20px;text-align:center;color:var(--mu);background:var(--sf)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.big{flex:1;max-width:220px;padding-left:6px;padding-right:6px;border:0;border-radius:14px;padding:15px 10px;font-weight:800;font-size:16px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.big.sec{background:var(--sf);color:var(--fg);border:2px solid var(--fg);box-shadow:none}
.big svg{width:22px;height:22px}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:none;font-size:30px;line-height:1;padding:0 4px}
.stp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.stp .ctl{display:flex;align-items:center;gap:8px}
.stp .ctl button{width:48px;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:24px;font-weight:800}
.stp .ctl input{width:70px;height:48px;text-align:center;font-size:22px;font-weight:800;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.tot{font-size:30px;font-weight:800;text-align:center}
.alert{border-radius:10px;padding:10px 12px;font-weight:600}
.alert.bad{background:var(--bads);color:var(--bad)}.alert.wa{background:var(--was);color:var(--wa)}.alert.ok{background:var(--oks);color:var(--ok)}
.ent{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px}
.ent img,.ent .ni{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
td.r,th.r{text-align:right}
.caras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cara{border:1px dashed var(--ln);background:var(--bg);border-radius:10px;padding:0;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative}
.cara img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cara span{font-size:22px}
.cara small{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 0;text-align:center}
#scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .guide{position:absolute;left:8%;right:8%;top:35%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#scan .bot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;gap:8px;flex-wrap:wrap}
#scan .bot input{flex:1;min-width:150px;padding:12px;border-radius:10px;border:0;font-size:18px;color:#000}
#scan .msg{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;color:#fff;text-align:center;font-weight:700;text-shadow:0 1px 3px #000}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:700;max-width:90vw;text-align:center}
.fin{display:flex;flex-direction:column;gap:8px}
.ocrimg{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#000}
.pbar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ac);width:0;transition:width .2s}
.ocrtxt{font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--mu);white-space:pre-wrap;max-height:90px;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px}
.rec{display:flex;flex-direction:column;gap:8px;border:2px solid var(--ok)}
.ln.th{grid-template-columns:52px 1fr auto}.thb{width:52px;height:64px;object-fit:contain;background:#fff;border-radius:8px}
.recf{display:flex;gap:8px}.recf figure{flex:1;margin:0;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:6px;text-align:center}.recf img{width:100%;height:190px;object-fit:contain}.recf figcaption{font-size:12px;color:var(--mu)}.recf .nof{display:flex;flex-direction:column;justify-content:center;min-height:200px}.recf .nof span{font-size:40px}
.recl{display:flex;gap:8px}.recl div{flex:1;background:#1F3864;color:#fff;border-radius:12px;padding:10px;text-align:center}.recl small{display:block;font-size:11px;opacity:.8;letter-spacing:.06em}.recl b{font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <div class="eb" style="display:flex;justify-content:space-between"><span>Astillero · Control de armado</span><a href="./" style="color:var(--ac);text-decoration:none">← Tablero</a></div>
    <h1 id="tit"></h1>
    <div class="mu" id="sub"></div>
  </header>
  <div id="remBox" hidden></div>
  <div class="card who"><label for="op" style="font-weight:700">Arma:</label><input id="op" placeholder="Tu nombre" autocomplete="name"></div>
  <section class="card prog">
    <div><div class="n" id="pLin">–</div><div class="l">líneas OK</div></div>
    <div><div class="n" id="pBot">–</div><div class="l">botellas</div></div>
    <div><div class="n" id="pPal">–</div><div class="l" id="pPalL">pallets</div></div>
    <div class="bar" id="pBar"></div>
  </section>
  <nav class="tabs" role="tablist">
    <button id="tL" role="tab" aria-selected="true">Líneas</button>
    <button id="tP" role="tab" aria-selected="false">Pallets</button>
    <button id="tF" role="tab" aria-selected="false">Terminar</button>
  </nav>
  <section id="vL" class="list" style="gap:10px">
    <div class="chips" id="flt">
      <button class="chip" data-f="todas" aria-pressed="true">Todas</button>
      <button class="chip" data-f="pen" aria-pressed="false">Pendientes</button>
      <button class="chip" data-f="dif" aria-pressed="false">Con diferencia</button>
      <button class="chip" data-f="ok" aria-pressed="false">OK</button>
    </div>
    <div class="list" id="list"></div>
  </section>
  <section id="vP" class="list" hidden><div class="card" style="display:flex;gap:8px;align-items:center;padding:10px 12px;position:sticky;top:0;z-index:5"><span>🔎</span><input id="pq" type="text" enterkeyhint="search" placeholder="Buscar producto o código" autocomplete="off" style="flex:1;border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--sf);font-size:16px"><button class="chip" id="pqx" hidden>✕</button></div><div id="pqn" class="mu" hidden style="text-align:center"></div><div id="vPc" class="list"></div></section>
  <section id="vF" class="fin" hidden></section>
</div>
<div class="dock"><button class="big" id="bScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></svg>Código</button><button class="big" id="bEtq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.2l1.4-2h6.8l1.4 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>Etiqueta</button><button class="big sec" id="bLista">Lista</button></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="camEtq" accept="image/*" capture="environment" hidden>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>

<script src="catalogo.js"></script>
<script>
const D={"nombres": ["A5576-EF", "A5580-EF", "A5577-EF", "A5581-EF", "A5582-EF"], "so": false, "cliente": "HIPER T Y N SRL", "entrega": "HIPER FREE SHOP", "fecha": "24/11/2026", "pedidos": ["A5576-EF: S00171", "A5580-EF: S00405", "A5577-EF: S00400", "A5581-EF: S00411", "A5582-EF: S00413"], "lineas": [{"code": "2936", "name": "VINO ESPUMOSO DECOY SPARKLING BRUT CUVEE 750 ML", "qty": 300, "upc": 12, "eans": ["669576019184"], "ceans": [], "loc": "P11 115-1", "fac": "A5576"}, {"code": "746", "name": "CHAMPAGNE DELAMOTTE ROSE 750 ML", "qty": 30, "upc": 6, "eans": ["3418760000715"], "ceans": [], "loc": "P11 100-2 (30)", "fac": "A5580"}, {"code": "745", "name": "CHAMPAGNE DELAMOTTE BRUT 750 ML", "qty": 276, "upc": 6, "eans": ["3418760000654"], "ceans": [], "loc": "P11 106-1 (276)", "fac": "A5577, A5580"}, {"code": "3446", "name": "CHAMPAGNE DELAMOTTE BLANC DE BLANCS 750 ML", "qty": 54, "upc": 6, "eans": [], "ceans": [], "loc": "P11 100-2 (54)", "fac": "A5577"}, {"code": "2260", "name": "VINO ARGIANO BRUNELLO DI MONTALCINO DOCG 2020 1500 ML", "qty": 10, "upc": 1, "eans": ["8022931002207"], "ceans": [], "loc": "CAM 1-2", "fac": "A5581"}, {"code": "2259", "name": "VINO ARGIANO BRUNELLO DI MONTALCINO DOCG 2020 750 ML", "qty": 240, "upc": 6, "eans": ["8022931502202"], "ceans": [], "loc": "8-3 (6); SIN UBICACIÓN", "fac": "A5581"}, {"code": "2788", "name": "VINO PAGO DE CARRAOVEJAS 2023 750 ML", "qty": 30, "upc": 6, "eans": ["8426411040305"], "ceans": ["18426411040500"], "loc": "22-01 (30)", "fac": "A5582"}, {"code": "3471", "name": "VINO OVERTURE 2022 750 ML", "qty": 120, "upc": 6, "eans": ["753604020225"], "ceans": [], "loc": "SIN UBICACIÓN", "fac": "A5576"}, {"code": "3469", "name": "VINO DUCKHORN NAPA VALLEY CABERNET SAUVIGNON 2023 750 ML", "qty": 300, "upc": 6, "eans": ["669576019344"], "ceans": [], "loc": "SIN UBICACIÓN", "fac": "A5576"}, {"code": "3470", "name": "VINO DUCKHORN NAPA VALLEY MERLOT 2022 750 ML", "qty": 300, "upc": 6, "eans": ["669576019283"], "ceans": [], "loc": "SIN UBICACIÓN", "fac": "A5576"}], "id": "A5576-A5580-A5577-7uhCQ7fs", "ver": "00f749af63"};
const CAT=window.CAT||{map:{},hermanos:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-UY');
const KEY='arm_'+D.id;
function toast(t,ms){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||2600)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let S={ents:[],pal:{},last:null,op:'',nuevos:{}};
try{const s=JSON.parse(lsGet(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
if(!S.op)S.op=lsGet('arm_op')||'';
if(!S.nuevos)S.nuevos={};
if(!S.cajasN)S.cajasN={};
for(const k in S.pal){if(S.pal[k]===true)S.pal[k]=['pal_'+k]}
const CARAS=['Cara 1','Cara 2','Cara 3','Cara 4'];
const palKeys=p=>(S.pal[p]||[]).filter(Boolean);
const SUELTO='SUELTO';const isOrig=p=>/^O\d+$/.test(p);const nCaras=p=>isOrig(p)?1:4;const caraNom=(p,i)=>isOrig(p)?'Etiqueta':CARAS[i];
function nuevoNom(pre){const P=pallets();let n=1;while(P.includes(pre+n))n++;return pre+n}
function save(){lsSet(KEY,JSON.stringify(S))}

/* ---- fotos en IndexedDB ---- */
let _db=null;
function idb(){if(_db)return _db;_db=new Promise((ok,ko)=>{try{const r=indexedDB.open('armado',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}});return _db}
async function fPut(k,b){const db=await idb();return new Promise((ok,ko)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=ok;t.onerror=()=>ko(t.error)})}
async function fGet(k){const db=await idb();return new Promise(ok=>{const t=db.transaction('f');const r=t.objectStore('f').get(k);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}
async function fDel(k){try{const db=await idb();db.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}}
const urls={};
async function fUrl(k){if(urls[k])return urls[k];const b=await fGet(k);if(!b)return '';return urls[k]=URL.createObjectURL(b)}
async function prep(file,max=1400){
  const u=URL.createObjectURL(file);
  try{const i=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=u});
    const k=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}finally{URL.revokeObjectURL(u)}
}
function hydrate(){document.querySelectorAll('img[data-k]').forEach(async im=>{const u=await fUrl(im.dataset.k);if(u)im.src=u})}

/* ---- datos ---- */
const L=D.lineas;
const dvok=c=>{const d=c.split('').map(Number),k=d.pop();let t=0;d.reverse().forEach((n,i)=>t+=n*(i%2?1:3));return (10-t%10)%10===k};const gs1=d=>{if(/^101\d{14}/.test(d)&&dvok(d.slice(3,17)))return d.slice(3,17);if(/^01\d{14}/.test(d)&&d.length>=16&&dvok(d.slice(2,16)))return d.slice(2,16);if(d.length===11&&dvok('0'+d))return '0'+d;return d};const norm=c=>gs1(String(c||'').replace(/\D/g,'')).replace(/^0+/,'');const esLote=c=>{const d=String(c||'').replace(/\D/g,'');return d.length>16&&gs1(d)===d};
const sumC=c=>S.ents.filter(e=>e.code===c).reduce((a,e)=>a+e.total,0);
function st(l){const s=sumC(l.code);if(!s)return 'pen';return s===l.qty?'ok':s<l.qty?'par':'exc'}
const ST={pen:['Pendiente','s-pen'],ok:['OK','s-ok'],par:['Falta','s-par'],exc:['Sobra','s-exc']};
const SINPAL='ÁREA DE ARMADO';
function pallets(){const p=new Set(S.ents.map(e=>e.pallet).filter(x=>x&&x!==SINPAL&&x!==SUELTO));Object.keys(S.pal).forEach(k=>p.add(k));return [...p].sort((a,b)=>(isOrig(a)-isOrig(b))||a.localeCompare(b,'es',{numeric:true}))}
/* ---- modo recorrido (piloto 18/11, solo pedidos con D.recorrido) ---- */
const REC=!!D.recorrido;
const rutaOrd=(a,b)=>(!a.loc)-(!b.loc)||String(a.loc||'').localeCompare(String(b.loc||''),'es',{numeric:true});
const tieneBot=l=>(l.eans||[]).length>0||Object.values(S.nuevos||{}).includes(l.code);
function faltan(l){const f=[];if(!l.img)f.push('foto de la botella');if(l.upc>1&&!l.imgc)f.push('foto de la caja');if(!tieneBot(l))f.push('código de barras de la botella');if(l.upc>1&&!tieneCaja(l))f.push('código de barras de la caja');return f}
function sigPend(desde){const O=L.slice().sort(rutaOrd),all=O.filter(l=>st(l)==='pen'||st(l)==='par');if(!all.length)return null;const sk=S.salt||{},R=all.filter(l=>!sk[l.code]),pool=R.length?R:all,ord=O.map(l=>l.code),pi=ord.indexOf(desde);return pool.find(l=>l.code!==desde&&ord.indexOf(l.code)>pi)||pool.find(l=>l.code!==desde)||null}
function saltar(code,m){S.salt=S.salt||{};S.salt[code]={m,at:Date.now()};save();close();render();pushProg();const n=sigPend(code);toast('⏭️ '+code+' queda pendiente: '+m,2500);if(n)setTimeout(()=>openLine(n.code),350)}
function cj(l,q){if(l.upc<=1)return fmt(q)+' u.';const c=Math.floor(q/l.upc),s=q%l.upc;return (c?c+' cj':'')+(c&&s?' + ':'')+(s?s+' u.':'')||'0'}

/* ---- render ---- */
let tab='L',flt='todas';
function render(){
  $('tit').textContent=(D.so?'Pedido ':'Factura'+(D.nombres.length>1?'s ':' '))+D.nombres.map(n=>n.replace(/-EF.*$/,'')).join(' · ');

const nq=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* ---- lectura de etiqueta (OCR en el celular) ---- */
const SW=new Set('VINO VINHO WINE ESPUMANTE LICOR WHISKY WHISKEY GIN RON VODKA TEQUILA CHAMPAGNE CERVEZA LATA BOTELLA CON SIN ESTUCHE CAJA DE DEL LA LE LES EL LOS LAS DI DA DO DU ET Y AND THE ML LT CL CC'.split(' '));
const deacc=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const toks=t=>deacc(t).replace(/[^A-Z0-9]+/g,' ').split(' ').filter(w=>w.length>=3&&!SW.has(w)&&!/^\d+$/.test(w));
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return m[b.length]}
function near(w,set){if(set.has(w))return 1;let best=0;for(const o of set){if(w.length>=5&&o.length>=4){const d=lev(w,o);if(d===1)best=Math.max(best,.8);else if(d===2&&w.length>=7)best=Math.max(best,.5)}if(w.length>=6&&o.length>=4&&(w.includes(o)||o.includes(w)))best=Math.max(best,.6)}return best}
function rank(text){
  const ot=new Set(toks(text)),yrs=(deacc(text).match(/\b(19[5-9]\d|20[0-4]\d)\b/g)||[]);
  const df={};L.forEach(l=>new Set(toks(l.name)).forEach(w=>df[w]=(df[w]||0)+1));
  return L.map(l=>{const ws=[...new Set(toks(l.name))];let tw=0,hw=0;
    ws.forEach(w=>{const wt=Math.min(w.length,8)/(df[w]||1);tw+=wt;hw+=wt*near(w,ot)});
    let sc=tw?hw/tw:0;const y=(l.name.match(/\b(19|20)\d{2}\b/)||[])[0];
    if(y&&yrs.length)sc+=yrs.includes(y)?.15:-.2;
    return {l,sc:Math.max(0,Math.min(1,sc))}}).sort((a,b)=>b.sc-a.sc);
}
let TW=null;
async function tess(){
  if(TW)return TW;
  await new Promise((ok,ko)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src='tess/tesseract.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
  TW=Tesseract.createWorker('eng',1,{workerPath:new URL('tess/worker.min.js',location.href).href,corePath:new URL('tess/',location.href).href,langPath:new URL('tess/',location.href).href,gzip:true,
    logger:m=>{const b=document.querySelector('#obar i'),t=$('ostat');if(!b)return;const pr=Math.round((m.progress||0)*100);
      if(m.status==='recognizing text'){b.style.width=pr+'%';t&&(t.textContent='Leyendo etiqueta… '+pr+'%')}else{t&&(t.textContent=m.status.startsWith('load')||m.status.startsWith('init')?'Preparando lector (la primera vez tarda un poco)…':'Procesando…')}}})
   .then(async w=>{await w.setParameters({tessedit_pageseg_mode:'11'});return w}).catch(e=>{TW=null;throw e});
  return TW;
}
async function ocrPrep(blob){
  const u=URL.createObjectURL(blob);
  try{const i=await new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=u});
    const k=Math.min(1,1600/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);
    const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(i,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(u)}
}
async function onEtq(file){
  if(!file)return;const b=await prep(file),u=URL.createObjectURL(b);

  if(b.dataset.pal){F.pallet=b.dataset.pal;showQ();return}
  if(b.dataset.zcode){PZ=null;palSheet(b.dataset.zcode);return}
  if(b.dataset.zpal){PZ.pallet=b.dataset.zpal;palSheet(PZ.code);return}
  if(b.dataset.z){const k=b.dataset.z[0]==='c'?'cajas':'sueltas';PZ[k]=Math.max(0,PZ[k]+(b.dataset.z[1]==='+'?1:-1));palSheet(PZ.code);return}
  if(b.dataset.palfoto){camFor='pal:'+b.dataset.palfoto+'|'+(b.dataset.cara||0);$('cam').value='';$('cam').click();return}
  if(b.dataset.edit){const e=S.ents.find(x=>x.id===b.dataset.edit);if(!e)return;const l=L.find(x=>x.code===e.code);const back=F?F.code:null;
    sheet(hdr('Corregir cantidad')+`<div class="card"><div style="font-weight:800">${esc(l?l.name:e.code)}</div><div class="mu">${esc(e.pallet)} · la foto se mantiene</div></div>
      <div class="stp"><b>Cajas${l&&l.upc>1?' (x'+l.upc+')':''}</b><input id="edC" type="number" inputmode="numeric" min="0" value="${e.cajas||0}" style="font-size:22px;width:110px;padding:8px;border:1px solid var(--ln);border-radius:8px"></div>
      <div class="stp"><b>Sueltas</b><input id="edS" type="number" inputmode="numeric" min="0" value="${e.sueltas||0}" style="font-size:22px;width:110px;padding:8px;border:1px solid var(--ln);border-radius:8px"></div>
      <button class="btn ok" data-edok="${esc(e.id)}" data-back="${esc(back||'')}" style="padding:14px">Guardar corrección</button>`);return}
  if(b.dataset.edok){const e=S.ents.find(x=>x.id===b.dataset.edok);if(!e)return;const l=L.find(x=>x.code===e.code),u=(l&&l.upc)||1;
    const c=Math.max(0,parseInt($('edC').value)||0),sl=Math.max(0,parseInt($('edS').value)||0),t=c*u+sl;if(!t){toast('Para dejarlo en 0 usá Borrar');return}
    e.editado={antes:e.total,at:Date.now(),op:S.op};e.cajas=c;e.sueltas=sl;e.total=t;save();close();render();pushProg();toast('Corregido: '+fmt(t));
    if(b.dataset.back)setTimeout(()=>openLine(b.dataset.back),200);return}  // editar carga sin perder la foto (Mario 24/11)
  if(b.dataset.del){if(b.dataset.sure){const i=S.ents.findIndex(x=>x.id===b.dataset.del);if(i>=0){if(S.ents[i].foto)fDel(S.ents[i].id);S.ents.splice(i,1);save();render();showQ();toast('Borrado');pushProg()}}else{b.dataset.sure=1;b.textContent='¿Seguro?'}return}
  switch(b.dataset.a){
    case 'close':close();break;
    case 'scanoff':stopScan();MODO=null;close();break;
    case 'scan':close();startScan();break;
    case 'mango':{const v=$('man').value;found(v);break}
    case 'todo':{const l=L.find(x=>x.code===F.code),f=Math.max(0,l.qty-sumC(F.code));F.cajas=l.upc>1?Math.floor(f/l.upc):0;F.sueltas=l.upc>1?f%l.upc:f;showQ();break}
    case 'znew':{PZ.pallet=nuevoNom('P');palSheet(PZ.code);break}
    case 'zorig':{PZ.pallet=nuevoNom('O');palSheet(PZ.code);break}
    case 'neworig':{F.pallet=nuevoNom('O');showQ();break}
    case 'areasuelto':{const b2=document.querySelector('[data-a=areasuelto]');if(b2&&!b2.dataset.sure){b2.dataset.sure=1;b2.textContent='¿Seguro? Todo lo del ÁREA DE ARMADO pasa a SUELTO. Tocá de nuevo';break}let k=0;S.ents.forEach(e=>{if(e.pallet===SINPAL){e.pallet=SUELTO;k++}});S.last=SUELTO;save();render();renderP();pushProg();toast('📦 '+k+(k===1?' carga pasada':' cargas pasadas')+' a SUELTO');break}
    case 'zsave':palSave();break;
    case 'newpal':{F.pallet=nuevoNom('P');showQ();break}
    case 'foto':camFor='line';$('cam').value='';$('cam').click();break;
    case 'lote':camFor='lote';$('cam').value='';$('cam').click();break;
    case 'verif':case 'verifbot':{const c=(document.querySelector('.sheet .card .mono')||{}).textContent;MODO={verif:c,bot:b.dataset.a==='verifbot'};close();startScan();setTimeout(()=>{const m=$('smsg');if(m)m.textContent=MODO&&MODO.bot?'Apuntá al código de la BOTELLA':'Apuntá al código de barras de la CAJA'},300);break}
    case 'verifman':{const c=(document.querySelector('.sheet .card .mono')||{}).textContent;S.verif=S.verif||{};S.verif[c]='foto';save();render();openLine(c,'lista');if(F&&F.code===c&&!F.foto){camFor='line';$('cam').value='';$('cam').click()}break}
    case 'verifreg':{const c=(document.querySelector('.sheet .card .mono')||{}).textContent;S.cajasN=S.cajasN||{};S.cajasN[b.dataset.ean]=c;S.verif=S.verif||{};S.verif[c]='caja';save();render();pushProg();toast('📦 Código registrado y producto confirmado');openLine(c,'caja');break}
    case 'save':saveE();break;
    case 'bajarfotos':bajarFotos();break;
    case 'zip':enviarZip();break;
    case 'subir':subirRespaldo();break;
    case 'traer':traerRemoto();break;
    case 'misfotos':subirRespaldo(true);break;
    case 'etq':$('camEtq').value='';$('camEtq').click();break;
    case 'lista':pickList();break;
    case 'asignar':pickList(b.dataset.ean);break;
    case 'botcod':MODO={botn:F.code};close();startScan();setTimeout(()=>{const m=$('smsg');if(m)m.textContent='Apuntá al código de barras de la BOTELLA'},300);break;
    case 'cajacod':MODO={caja:F.code};close();startScan();setTimeout(()=>{const m=$('smsg');if(m)m.textContent='Apuntá al código de barras de la CAJA'},300);break;
    case 'escaja':{const ean=b.dataset.ean,code=b.dataset.code;delete S.nuevos[ean];save();asignarCaja(ean,code);break}
  }
  if(b.id==='bEnv')share();
  if(b.dataset.fot){shareFotos(b.dataset.fot);return}
  if(b.id==='bFotSeq'){if(FOTI>=FOTK.length)FOTI=0;const ok=await shareFotos(FOTK[FOTI]);if(ok){FOTI++;updSeq();toast(FOTI<FOTK.length?'Parte enviada. Tocá de nuevo para la siguiente.':'✅ Todas las fotos enviadas',3500)}return}
  if(b.id==='bCop'){try{await navigator.clipboard.writeText(resumen());toast('Copiado')}catch(x){toast('No se pudo copiar')}}
  if(b.id==='bRes'){if(b.dataset.sure){for(const x of S.ents)if(x.foto)fDel(x.id);for(const p of Object.keys(S.pal))palKeys(p).forEach(fDel);S.ents=[];S.pal={};S.nuevos={};S.cajasN={};S.last=null;save();render();renderF();toast('Borrado todo')}else{b.dataset.sure=1;b.textContent='¿Seguro? Se borra todo lo cargado. Tocá de nuevo'}}
});
$('cam').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;const b=await prep(f);
  if(camFor==='line'&&F){F.foto=b;try{await fPut('d_'+F.code,b)}catch(e){}showQ()}
  else if(camFor==='lote'&&F){const k='lote_'+F.code+'_'+Date.now().toString(36);try{await fPut(k,b);S.lotes=S.lotes||{};if(S.lotes[F.code])fDel(S.lotes[F.code]);S.lotes[F.code]=k;save();vivFoto(`lote_${F.code}.jpg`,k,'lote',F.code);showQ();render();toast('🏷️ Foto del lote guardada')}catch(x){toast('No se pudo guardar la foto')}}
  else if(camFor&&camFor.startsWith('pal:')){const [p,ci]=camFor.slice(4).split('|');const i=+ci||0;const k='pal_'+p+'_'+i+'_'+Date.now().toString(36);
    try{await fPut(k,b);const arr=S.pal[p]||[];if(arr[i])fDel(arr[i]);arr[i]=k;S.pal[p]=arr;save();vivFoto(`${p}_cara${i+1}.jpg`,k,'pallet',p);renderP();pushProg();toast(p+': '+caraNom(p,i)+' guardada ('+palKeys(p).length+'/'+nCaras(p)+')')}catch(x){toast('No se pudo guardar la foto')}}
  camFor=null;
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='zipNom'){ZIPF=null;clearTimeout(window._zt);window._zt=setTimeout(()=>armarZip().catch(()=>{}),600)}});
$('bScan').addEventListener('click',startScan);
$('bLista').addEventListener('click',()=>pickList());
$('bEtq').addEventListener('click',()=>{$('camEtq').value='';$('camEtq').click();tess().catch(()=>{})});
$('camEtq').addEventListener('change',e=>onEtq(e.target.files[0]));
$('op').value=S.op;$('op').addEventListener('input',e=>{S.op=e.target.value.trim();lsSet('arm_op',S.op);save();pushProg()});
function setTab(t){tab=t;[['L','tL','vL'],['P','tP','vP'],['F','tF','vF']].forEach(([k,b,v])=>{$(b).setAttribute('aria-selected',k===t);$(v).hidden=k!==t});render()}
$('tL').addEventListener('click',()=>setTab('L'));$('tP').addEventListener('click',()=>setTab('P'));$('tF').addEventListener('click',()=>setTab('F'));
render();
if(S.openCode&&L.find(l=>l.code===S.openCode))setTimeout(()=>openLine(S.openCode,'lista'),300);
verRemoto();setInterval(verRemoto,30000);
if(getPin()&&S.ents.length)pushProg();
/* ---- aviso de pedido actualizado (Mario 25/11): si Mario cambia el pedido, pedir recargar ---- */
(function(){if(!D||!D.ver)return;let avisado=false;
  async function chk(){if(avisado||document.hidden)return;try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text();const m=t.match(/"ver":\s*"([0-9a-f]+)"/);
    if(m&&m[1]!==D.ver){avisado=true;const b=document.createElement('button');b.id='verNueva';
      b.style.cssText='position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:99;background:#B3261E;color:#fff;border:0;border-radius:14px;padding:16px;font:800 17px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)';
      b.innerHTML='📢 Mario cambió este pedido<br><span style="font-weight:600;font-size:14px">Tocá acá para actualizar la lista. Lo que ya cargaste no se pierde.</span>';
      b.onclick=()=>{try{save()}catch(e){}location.reload()};document.body.appendChild(b);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}catch(e){}}
  setTimeout(chk,5000);setInterval(chk,120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})})();
</script>
</body>
