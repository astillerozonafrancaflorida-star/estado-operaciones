<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Armado en vivo</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#F2F3EF;color:#1A211D}
header{background:#1F3864;color:#fff;padding:12px 16px;position:sticky;top:0}h1{margin:0;font-size:18px}.sub{opacity:.85;font-size:13px}
main{max-width:900px;margin:auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #D9DDD6;border-radius:12px;padding:12px 14px}.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.n{font-size:26px;font-weight:800}.l{font-size:12px;color:#5E6862}.bar{grid-column:1/-1;height:8px;border-radius:4px;background:#D9DDD6;overflow:hidden;display:flex}.bar i{height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid #E4E7EC;text-align:left}td.r,th.r{text-align:right}
tr.ok td{background:#CFEBD4}tr.par td{background:#FBEFD6}tr.exc td{background:#F9E0DE}.loc{background:#1A211D;color:#fff;border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700}
.mu{color:#5E6862;font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}</style></head>
<body><header><a href="./" style="color:#cfd8ea;text-decoration:none;font-weight:700;font-size:13px">← Tablero de pedidos</a><h1 id="t">Armado en vivo</h1><div class="sub" id="s">Conectando…</div></header><main id="m"><div class="card mu">Esperando datos del celular…</div></main>
<script>
const API='https://astillero-armado.astillerozonafrancaflorida.workers.dev';
const id=new URLSearchParams(location.search).get('p')||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-UY');
const ST={pen:'Pendiente',ok:'OK',par:'Falta',exc:'Sobra'};
let LISTO=null;
async function listo(){try{const pj=await (await fetch('pedidos.json',{cache:'no-store'})).json();const e=pj.find(x=>x.id===id);if(!e||!e.listo||!e.listo.lin)return false;LISTO=e;const t=e.listo,L=t.lin;
 const f=t.fecha?new Date(t.fecha).toLocaleString('es-UY',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 document.getElementById('t').textContent=e.titulo;document.getElementById('s').innerHTML=`${esc(e.cliente)}${e.entrega?' · '+esc(e.entrega):''} · armó ${esc(t.armo||'—')} · ${esc(f)}`;
 const tq=L.reduce((a,l)=>a+l[2],0),ta=L.reduce((a,l)=>a+l[3],0);
 let h=`<section class="card" style="background:#CFEBD4;border-color:#2F7A3F"><b>✅ Terminado y respaldado</b><div class="mu">Datos del respaldo final (${esc(t.carpeta)}). El avance en vivo del celular ya no se muestra.</div></section>`;
 h+=`<section class="card prog"><div><div class="n">${t.ok}/${t.n}</div><div class="l">líneas OK</div></div><div><div class="n">${fmt(ta)}/${fmt(tq)}</div><div class="l">botellas</div></div><div></div><div class="bar"><i style="width:${t.n?t.ok/t.n*100:0}%;background:#2F7A3F"></i></div></section>`;
 h+=`<section class="card"><table><thead><tr><th>Producto</th><th class="r">Armado</th><th class="r">Estado</th></tr></thead><tbody>`+L.map(l=>{const st=l[3]===l[2]?'ok':l[3]<l[2]?'par':'exc';return `<tr class="${st}"><td><b>${esc(l[0])}</b> ${esc(l[1])}</td><td class="r">${fmt(l[3])}/${fmt(l[2])}</td><td class="r">${ST[st]}${st==='par'?' '+fmt(l[2]-l[3]):st==='exc'?' '+fmt(l[3]-l[2]):''}</td></tr>`}).join('')+`</tbody></table></section>`;
 document.getElementById('m').innerHTML=h;return true}catch(e){return false}}
async function tick(){
  if(LISTO)return;
  try{const r=await fetch(API+'/progreso/'+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();
    if(!d){document.getElementById('s').textContent='Todavía no hay avance de este pedido (el celular tiene que tener el PIN puesto).';return}
    const L=d.lineas||[],cnt={ok:0,par:0,exc:0,pen:0};L.forEach(l=>cnt[l.st]++);const tot=L.reduce((a,l)=>a+l.q,0),ctl=L.reduce((a,l)=>a+l.s,0);
    const ago=Math.round((Date.now()-d.recibido)/60000);
    document.getElementById('t').textContent=d.titulo||id;
    document.getElementById('s').innerHTML=`${esc(d.cliente)}${d.entrega?' · '+esc(d.entrega):''} · arma ${esc(d.op||'—')} · <span class="dot" style="background:${ago<5?'#2F7A3F':'#9A6400'}"></span>último cambio hace ${ago<1?'menos de 1':ago} min`;
    const w=k=>L.length?cnt[k]/L.length*100:0;
    let h=`<section class="card prog"><div><div class="n">${cnt.ok}/${L.length}</div><div class="l">líneas OK</div></div><div><div class="n">${fmt(ctl)}/${fmt(tot)}</div><div class="l">botellas</div></div><div><div class="n">${Object.keys(d.pallets||{}).filter(k=>k!=='SUELTO'&&k!=='ÁREA DE ARMADO').length}</div><div class="l">pallets</div></div><div class="bar"><i style="width:${w('ok')}%;background:#2F7A3F"></i><i style="width:${w('par')}%;background:#9A6400"></i><i style="width:${w('exc')}%;background:#B3261E"></i></div></section>`;
    h+=`<section class="card"><table><thead><tr><th>Producto</th><th>Ubic.</th><th class="r">Armado</th><th class="r">Estado</th></tr></thead><tbody>`+L.map(l=>`<tr class="${l.st}"><td><b>${esc(l.c)}</b> ${esc(l.n)}</td><td><span class="loc">${esc(l.loc)}</span></td><td class="r">${fmt(l.s)}/${fmt(l.q)}</td><td class="r">${ST[l.st]}${l.st==='par'?' '+fmt(l.q-l.s):l.st==='exc'?' '+fmt(l.s-l.q):''}</td></tr>`).join('')+`</tbody></table></section>`;
    const P=d.pallets||{};h+=`<section class="card"><b>Pallets</b>`+Object.keys(P).sort((a,b)=>{const g=k=>k==='ÁREA DE ARMADO'?3:k==='SUELTO'?2:/^O\d+$/.test(k)?1:0;return (g(a)-g(b))||a.localeCompare(b,'es',{numeric:true})}).map(p=>`<div style="margin-top:6px"><b>${esc(p)}${/^O\d+$/.test(p)?' (de origen)':''}</b> · ${fmt(P[p].u)} unid.${p==='SUELTO'?' · sin pallet':p==='ÁREA DE ARMADO'?' · sin paletizar':' · 📷 '+(P[p].f||0)+'/'+(/^O\d+$/.test(p)?1:4)}<div class="mu">${Object.entries(P[p].c||{}).map(([c,u])=>esc(c)+' ('+fmt(u)+')').join(' · ')}</div></div>`).join('')+`</section>`;
    const cn=Object.entries(d.cajasN||{});if(cn.length)h+=`<section class="card"><b>Códigos de CAJA nuevos</b>`+cn.map(([e,c])=>`<div class="mu">${esc(e)} → ${esc(c)}</div>`).join('')+`</section>`;
    const nv=Object.entries(d.nuevos||{});if(nv.length)h+=`<section class="card"><b>Códigos de barras nuevos</b>`+nv.map(([e,c])=>`<div class="mu">${esc(e)} → ${esc(c)}</div>`).join('')+`</section>`;
    document.getElementById('m').innerHTML=h;
  }catch(e){document.getElementById('s').textContent='Sin conexión con el intermediario. Reintentando…'}
}
listo().then(ok=>{if(!ok){tick();setInterval(tick,5000)}});
</script></body></html>
