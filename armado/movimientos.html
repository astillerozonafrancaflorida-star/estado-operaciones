<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Movimientos de mercadería</title>
<style>
:root{--bg:#F2F3EF;--sf:#fff;--fg:#1A211D;--mu:#5E6862;--ln:#D9DDD6;--ac:#1F5F8B;--ok:#2F7A3F;--oks:#E1F0E3;--wa:#9A6400;--was:#FBEFD6;--bad:#B3261E;--bads:#F9E0DE}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 130px;display:flex;flex-direction:column;gap:12px}
h1{font-size:23px;margin:0}.eb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:700}
.mu{color:var(--mu);font-size:13px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.who{display:flex;gap:8px;align-items:center}.who input{flex:1;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;background:var(--sf)}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modo button{border:2px solid var(--ln);background:var(--sf);border-radius:12px;padding:12px 8px;font-weight:800}
.modo button[aria-pressed=true]{border-color:var(--ac);background:#E5EEF5;color:var(--ac)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.big{flex:1;max-width:260px;border:0;border-radius:14px;padding:15px 10px;font-weight:800;font-size:16px;background:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.big.sec{background:var(--sf);color:var(--fg);border:2px solid var(--fg);box-shadow:none}
.btn{border:1px solid var(--ln);background:var(--sf);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.loc{background:#1A211D;color:#fff;border-radius:5px;padding:1px 6px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}.x{border:0;background:none;font-size:30px;line-height:1;padding:0 4px}
.stp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:48px;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:24px;font-weight:800}
.ctl input{width:70px;height:48px;text-align:center;font-size:22px;font-weight:800;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.tot{font-size:28px;font-weight:800;text-align:center}
.inp{border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:18px;background:var(--sf);width:100%}
.sug{display:flex;gap:6px;flex-wrap:wrap}
.alert{border-radius:10px;padding:10px 12px;font-weight:600}.alert.bad{background:var(--bads);color:var(--bad)}.alert.wa{background:var(--was);color:var(--wa)}.alert.ok{background:var(--oks);color:var(--ok)}
.it{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--ok);border-radius:10px;padding:10px 12px}
.it.pend{border-left-color:var(--wa)}.it b{font-size:14px}
.res{display:flex;flex-direction:column;gap:6px}.res button{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
#scan{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .guide{position:absolute;left:8%;right:8%;top:35%;height:22%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#scan .bot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;gap:8px}#scan .bot input{flex:1;padding:12px;border-radius:10px;border:0;font-size:18px;color:#000}
#scan .msg{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;color:#fff;text-align:center;font-weight:700;text-shadow:0 1px 3px #000}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;font-weight:700;max-width:90vw;text-align:center}
</style></head><body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:4px">
    <div class="eb" style="display:flex;justify-content:space-between"><span>Astillero · Depósito</span><a href="./" style="color:var(--ac);text-decoration:none">← Tablero</a></div>
    <h1>Movimientos de mercadería</h1><div class="mu" id="act"></div>
  </header>
  <div class="card who"><label for="op" style="font-weight:700">Soy:</label><input id="op" placeholder="Tu nombre"></div>
  <div class="modo"><button id="mR" aria-pressed="true">↔️ Reubicar<br><span class="mu" style="font-weight:400">de un lugar a otro</span></button><button id="mL" aria-pressed="false">📥 Ubicar lo que llega<br><span class="mu" style="font-weight:400">contenedor / sin ubicación</span></button></div>
  <div class="eb" style="display:flex;justify-content:space-between"><span>Últimos 5 movimientos de este celular</span><button id="verT" style="border:0;background:none;color:var(--ac);font:inherit;font-weight:700">Ver todos</button></div>
  <div id="hoy" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<div class="dock"><button class="big" id="bScan">▥ Código</button><button class="big sec" id="bBus">Buscar producto</button></div>
<div id="root"></div><div id="toast" class="toast" hidden></div>
<script src="movdata.js"></script>
<script>
const API='https://astillero-armado.astillerozonafrancaflorida.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('es-UY');
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
function toast(t,ms){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||2800)}
const M=window.MOV||{productos:[],ubicaciones:[]};const P=M.productos,UB=M.ubicaciones;
$('act').textContent='Ubicaciones según Odoo al '+(M.actualizado||'—');
let H=[];try{H=JSON.parse(ls('mov_hist')||'[]')}catch(e){}
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^mov_\d{4}-/.test(k)){JSON.parse(localStorage.getItem(k)||'[]').forEach(m=>{if(!H.some(x=>x.id===m.id))H.push(m)})}}H.sort((a,b)=>b.at<a.at?-1:1)}catch(e){}
const saveH=()=>{H=H.slice(0,100);ls('mov_hist',JSON.stringify(H))};saveH();
let verTodos=false;
let modo='R';
$('op').value=ls('arm_op')||'';$('op').addEventListener('input',e=>ls('arm_op',e.target.value.trim()));
function setModo(m){modo=m;$('mR').setAttribute('aria-pressed',m==='R');$('mL').setAttribute('aria-pressed',m==='L')}
$('mR').onclick=()=>setModo('R');$('mL').onclick=()=>setModo('L');
const dvok=c=>{const d=c.split('').map(Number),k=d.pop();let t=0;d.reverse().forEach((n,i)=>t+=n*(i%2?1:3));return (10-t%10)%10===k};const gs1=d=>{if(/^101\d{14}/.test(d)&&dvok(d.slice(3,17)))return d.slice(3,17);if(/^01\d{14}/.test(d)&&d.length>=16&&dvok(d.slice(2,16)))return d.slice(2,16);if(d.length===11&&dvok('0'+d))return '0'+d;return d};const norm=c=>gs1(String(c||'').replace(/\D/g,'')).replace(/^0+/,'');const esLote=c=>{const d=String(c||'').replace(/\D/g,'');return d.length>16&&gs1(d)===d};
// ubicaciones del producto: "28-A (120); P11 117-3; SIN UBICACIÓN (6)" (las notas [..] se ignoran)
function locs(p){return (p.l||'').replace(/\[[^\]]*\]/g,'').split(/[;,]/).map(t=>t.trim()).filter(Boolean).map(t=>{const m=t.match(/^(.*?)\s*\((\d+)(?![\d-])[^)]*\)\s*$/);return m?{u:m[1].trim(),q:+m[2]}:{u:t,q:null}})}
// normalizar lo que escriben: "2a"→"2-A", "28 1"→"28-1", "117-3"→"P11 117-3", "cam 4"→"CAM 4"
function nUb(t){let l=String(t||'').trim().toUpperCase().replace(/\s*-\s*/g,'-').replace(/\b0+(\d)/g,'$1');
  if(!l)return '';if(/^SIN UBIC/.test(l.replace('Ó','O')))return 'SIN UBICACIÓN';
  let m=l.match(/^(\d+)\s*-?\s*A$/);if(m)return m[1]+'-A';
  m=l.match(/^(\d+)[\s-](\d)$/);if(m&&+m[1]<100)return m[1]+'-'+m[2];
  m=l.match(/^(?:P\s*-?11\s*)?\(?(1[0-2]\d)[\s-](\d)\)?$/);if(m)return 'P11 '+m[1]+'-'+m[2];
  m=l.match(/^CAM(?:ARA)?\s*(\d+)$/);if(m)return 'CAM '+m[1];
  return l}
const UBS=UB.map(x=>x.u);
function sug(q){const n=nUb(q);if(!n)return [];const k=n.replace(/[\s-]/g,'');return UBS.filter(u=>u.replace(/[\s-]/g,'').startsWith(k)).slice(0,8)}

/* ---- hoja ---- */
let F=null;
function close(){F=null;$('root').innerHTML=''}
function sheet(h){$('root').innerHTML=`<div class="scrim" id="scrim"><div class="sheet">${h}</div></div>`;$('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()})}
const hdr=t=>`<div class="sh"><h2 style="margin:0;font-size:20px">${t}</h2><button class="x" data-a="close">×</button></div>`;
function abrir(p,cajas0){
  const L=locs(p);
  F={p,cajas:cajas0||0,sueltas:0,desde:modo==='L'?(L.find(x=>/^SIN UBIC/.test(x.u))?'SIN UBICACIÓN':'LLEGADA'):(L.length===1?L[0].u:null),hacia:''};
  dibujar();
}
function dibujar(){const p=F.p,L=locs(p),tot=F.cajas*p.u+F.sueltas,d=L.find(x=>x.u===F.desde);
  const opcD=modo==='L'?[{u:'LLEGADA',q:null,t:'Llegó (contenedor)'},...L.filter(x=>/^SIN UBIC/.test(x.u))]:L;
  sheet(hdr(esc(p.c))+`<div class="card"><b>${esc(p.n)}</b><div class="mu">Stock ${fmt(p.s)} · ${p.u>1?'caja x'+p.u:'unidad'}</div>
   <div class="mu" style="margin-top:4px">${(p.ce||[]).length?'📦 Código de caja: '+p.ce.map(e=>'<span class="mono">…'+esc(e.slice(-6))+'</span>').join(', '):'📦 Sin código de caja'}</div>
   <button class="btn" data-a="cargacaja" style="margin-top:6px">📦 ${(p.ce||[]).length?'Agregar otro':'Cargar'} código de caja</button>
   <div class="chips" style="margin-top:6px">${L.length?L.map(x=>`<span class="loc">${esc(x.u)}${x.q!=null?' ('+fmt(x.q)+')':''}</span>`).join(''):'<span class="mu">Sin ubicaciones cargadas</span>'}</div></div>
   <div><div class="eb" style="margin-bottom:6px">Desde</div><div class="chips">${opcD.map(x=>`<button class="chip" data-desde="${esc(x.u)}" aria-pressed="${x.u===F.desde}">${esc(x.t||x.u)}${x.q!=null?' ('+fmt(x.q)+')':''}</button>`).join('')||'<span class="mu">El producto no tiene ubicaciones: usá "Ubicar lo que llega".</span>'}</div></div>
   ${p.u>1?`<div class="stp"><b>Cajas (x${p.u})</b><div class="ctl"><button data-q="c-">−</button><input id="qc" inputmode="numeric" value="${F.cajas}"><button data-q="c+">+</button></div></div>`:''}
   <div class="stp"><b>${p.u>1?'Sueltas':'Unidades'}</b><div class="ctl"><button data-q="s-">−</button><input id="qs" inputmode="numeric" value="${F.sueltas}"><button data-q="s+">+</button></div></div>
   <div class="tot"><span id="qt">${fmt(tot)}</span> <span class="mu">unid.</span></div>
   ${d&&d.q?`<button class="btn" data-a="todo">Todo lo de ${esc(d.u)} (${fmt(d.q)})</button>`:''}
   <div><div class="eb" style="margin-bottom:6px">Hacia</div><input id="hacia" class="inp" placeholder="Ej: 2A, 28-1, 117-3, CAM 4" value="${esc(F.hacia)}" autocomplete="off"><div class="sug" id="sug" style="margin-top:6px"></div><div class="mu" id="hn"></div></div>
   <button class="btn ok" id="bG" data-a="guardar" style="padding:14px">Guardar movimiento</button>`);
  const bind=(id,k)=>{const i=$(id);if(i)i.oninput=()=>{F[k]=Math.max(0,parseInt(i.value)||0);$('qt').textContent=fmt(F.cajas*p.u+F.sueltas)}};bind('qc','cajas');bind('qs','sueltas');
  const h=$('hacia');const upd=()=>{F.hacia=h.value;const s=sug(h.value),n=nUb(h.value);$('sug').innerHTML=s.map(u=>`<button class="chip" data-hacia="${esc(u)}">${esc(u)}</button>`).join('');
    $('hn').innerHTML=n?(UBS.includes(n)?`Se guarda como <b>${esc(n)}</b>`:`<span style="color:var(--wa)">⚠️ "${esc(n)}" no está en el mapa. Revisá que esté bien escrita.</span>`):''};h.oninput=upd;upd();
}
async function guardar(){const p=F.p,tot=F.cajas*p.u+F.sueltas,hacia=nUb(F.hacia);
  if(!($('op').value||'').trim()){toast('Poné tu nombre arriba ("Soy:")');return}
  if(!F.desde){toast('Elegí "Desde"');return}if(!tot){toast('Poné la cantidad');return}if(!hacia){toast('Escribí "Hacia"');return}
  if(hacia===F.desde){toast('Desde y hacia son iguales');return}
  const d=locs(p).find(x=>x.u===F.desde);if(d&&d.q!=null&&tot>d.q&&!confirm(`En ${d.u} figuran ${d.q} y vas a mover ${tot}. ¿Seguro?`))return;
  const mv={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tipo:modo==='L'?'ubicar':'reubicar',code:p.c,nombre:p.n,cant:tot,cajas:F.cajas,sueltas:F.sueltas,upc:p.u,desde:F.desde,hacia,quien:$('op').value.trim(),at:new Date().toISOString(),hacia_en_mapa:UBS.includes(hacia)};
  H.unshift({...mv,env:false});saveH();close();render();enviar();
}
async function pin(){let p=ls('arm_pin');if(!p){p=(prompt('PIN del depósito (se pide una sola vez en este celular):')||'').trim();if(p)ls('arm_pin',p)}return p}
let enviando=false;
async function enviar(){if(enviando)return;enviando=true;try{for(const m of H.filter(x=>!x.env)){
    const {env,...mv}=m;const b64=btoa(unescape(encodeURIComponent(JSON.stringify(mv))));
    const r=await fetch(API+'/foto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:await pin(),carpeta:'MOVIMIENTOS-'+mv.at.slice(0,10),nombre:mv.id+'.json',b64})});
    if(r.status===403){ls('arm_pin','');toast('PIN incorrecto');break}if(!r.ok)break;m.env=true;saveH();render()}}catch(e){}finally{enviando=false}}
function render(){const L=verTodos?H:H.slice(0,5);$('verT').hidden=H.length<=5;$('verT').textContent=verTodos?'Ver solo 5':'Ver todos ('+H.length+')';
  $('hoy').innerHTML=L.length?L.map((m,i)=>{const d=new Date(m.at),hoy=d.toDateString()===new Date().toDateString();
    const cant=m.upc>1&&m.cajas?`${m.cajas} caja${m.cajas>1?'s':''} x${m.upc}${m.sueltas?' + '+m.sueltas+' sueltas':''} = ${fmt(m.cant)} unid.`:`${fmt(m.cant)} unid.`;
    return `<div class="it ${m.env?'':'pend'}"><div style="flex:1"><div class="mu">${i===0&&!verTodos?'<b style="color:var(--ac)">ÚLTIMO · </b>':''}${hoy?'hoy':d.toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit'})} ${d.toTimeString().slice(0,5)} · ${esc(m.quien||'')}</div>
      <b>${esc(m.code)} ${esc(m.nombre)}</b><div>${cant}</div><div style="margin-top:4px"><span class="loc">${esc(m.desde)}</span> → <span class="loc">${esc(m.hacia)}</span></div></div>
      <div class="mu" style="text-align:right;white-space:nowrap">${m.env?'✔ enviado':'⏳ pendiente'}</div></div>`}).join(''):'<div class="mu">Todavía no hay movimientos en este celular.</div>'}
$('verT').onclick=()=>{verTodos=!verTodos;render()};
render();enviar();setInterval(enviar,20000);

/* ---- buscar / escanear ---- */
function buscar(cajaDe){CAJA_DE=cajaDe||null;sheet(hdr(cajaDe?'¿De qué producto es esta caja?':'Buscar producto')+(cajaDe?`<div class="mu">Código de caja <span class="mono">${esc(cajaDe)}</span></div>`:'')+`<input id="bq" class="inp" placeholder="Nombre o código"><div class="res" id="br"></div>`);
  const d=()=>{const q=($('bq').value||'').toLowerCase().trim();$('br').innerHTML=q.length<2?'<div class="mu">Escribí al menos 2 letras.</div>':P.filter(p=>p.c===q||p.n.toLowerCase().includes(q)).slice(0,30).map(p=>`<button data-p="${esc(p.c)}"><b>${esc(p.c)}</b> ${esc(p.n)}<div class="mu">${esc(p.l||'sin ubicación')}</div></button>`).join('')||'<div class="mu">Sin resultados.</div>'};$('bq').oninput=d;d();setTimeout(()=>$('bq').focus(),50)}
function porCodigo(raw){const c=norm(raw);if(!c)return;
  const pc=P.find(p=>(p.ce||[]).includes(c));if(pc){abrir(pc,1);toast('📦 Caja escaneada');return}
  const h=P.filter(p=>p.e.includes(c)||p.c===String(raw).trim());
  if(h.length===1)return abrir(h[0]);
  if(h.length>1){sheet(hdr('¿Cuál es?')+`<div class="res">${h.map(p=>`<button data-p="${esc(p.c)}"><b>${esc(p.c)}</b> ${esc(p.n)}</button>`).join('')}</div>`);return}
  sheet(hdr('No encontrado')+`<div class="alert bad">El código <span class="mono">${esc(c)}</span> no está en Odoo.</div><button class="btn pri" data-a="buscar">Buscar por nombre</button><button class="btn" data-cajade="${esc(c)}" style="margin-top:8px">📦 Es el código de una caja → elegir el producto</button>`)}
let scan=null;
async function startScan(){$('root').innerHTML=`<div id="scan"><video id="vid" playsinline muted autoplay></video><div class="guide"></div><div class="msg" id="smsg">Apuntá al código de barras</div><div class="bot"><input id="man" inputmode="numeric" placeholder="o escribí el código"><button class="btn pri" data-a="mango">OK</button><button class="btn" data-a="scanoff">Cerrar</button></div></div>`;
  const v=$('vid');try{if('BarcodeDetector' in window){const fm=await BarcodeDetector.getSupportedFormats().catch(()=>[]);const want=['ean_13','ean_8','upc_a','upc_e','code_128','itf'].filter(f=>fm.includes(f));
      if(want.length){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=st;await v.play();const bd=new BarcodeDetector({formats:want});scan={stop:()=>st.getTracks().forEach(t=>t.stop())};
        const loop=async()=>{if(!scan)return;try{const r=await bd.detect(v);if(r.length&&scan){found(r[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop();return}}
    await new Promise((ok,ko)=>{if(window.ZXingBrowser)return ok();const s=document.createElement('script');s.src='zxing-browser.min.js';s.onload=ok;s.onerror=ko;document.head.appendChild(s)});
    const rd=new ZXingBrowser.BrowserMultiFormatReader();const ctl=await rd.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},v,res=>{if(res&&scan)found(res.getText())});scan={stop:()=>ctl.stop()};
  }catch(e){$('smsg').textContent='No se pudo abrir la cámara. Escribí el código abajo.'}}
function stopScan(){if(scan){try{scan.stop()}catch(e){}scan=null}}
function found(raw){stopScan();try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}if(esLote(raw)){toast('Ese código largo es el de LOTE/FECHA de la caja. Escaneá el OTRO código largo (el del producto).',5000);setTimeout(startScan,1200);return}if(MODO_CAJA){const p=MODO_CAJA;MODO_CAJA=null;asignarCaja(p,raw);return}porCodigo(raw)}
/* ---- códigos de caja ---- */
let MODO_CAJA=null,CAJA_DE=null;
const CJ=JSON.parse(ls('mov_cajas')||'[]');const saveCJ=()=>ls('mov_cajas',JSON.stringify(CJ));
CJ.forEach(k=>{const p=P.find(x=>x.c===k.code);if(p&&!(p.ce||[]).includes(k.ean))(p.ce=p.ce||[]).push(k.ean)});
function gtinOk(c){if(!/^\d{8}$|^\d{12,14}$/.test(c))return false;const d=c.split('').map(Number),k=d.pop();let t=0;d.reverse().forEach((n,i)=>t+=n*(i%2?1:3));return (10-t%10)%10===k}
function asignarCaja(p,raw){const c=norm(raw),cr=String(raw||'').replace(/\D/g,'');if(!c){toast('Código vacío');return}
  const bot=P.find(x=>(x.e||[]).includes(c));if(bot){toast(`❌ Ese código es de la botella de ${bot.c} ${bot.n}, no de una caja`,5000);abrir(p);return}
  const otro=P.find(x=>x!==p&&(x.ce||[]).includes(c));if(otro){toast(`❌ Ese código de caja ya es de ${otro.c} ${otro.n}`,5000);abrir(p);return}
  if((p.ce||[]).includes(c)){toast('Ese código de caja ya estaba cargado');abrir(p);return}
  if(!gtinOk(cr)&&!gtinOk(c)&&!confirm(`El código ${cr} no parece un código de barras válido (no coincide el dígito verificador). ¿Guardarlo igual?`)){abrir(p);return}
  (p.ce=p.ce||[]).push(c);CJ.push({ean:c,raw:cr,code:p.c,nombre:p.n,quien:($('op').value||'').trim(),at:new Date().toISOString(),env:false});saveCJ();
  toast('📦 Código de caja guardado para '+p.c);abrir(p);enviarCajas()}
let envC=false;async function enviarCajas(){if(envC)return;envC=true;try{for(const k of CJ.filter(x=>!x.env)){
    const b64=btoa(unescape(encodeURIComponent(JSON.stringify({ean:k.ean,raw:k.raw,code:k.code,nombre:k.nombre,quien:k.quien,at:k.at}))));
    const r=await fetch(API+'/foto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:await pin(),carpeta:'CODIGOS-CAJA',nombre:k.ean+'-'+k.code+'.json',b64})});
    if(r.status===403){ls('arm_pin','');toast('PIN incorrecto');break}if(!r.ok)break;k.env=true;saveCJ()}}catch(e){}envC=false}
enviarCajas();setInterval(enviarCajas,30000);
$('bScan').onclick=startScan;$('bBus').onclick=buscar;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.cajade){buscar(b.dataset.cajade);return}
  if(b.dataset.p){const p=P.find(p=>p.c===b.dataset.p);if(CAJA_DE){const c=CAJA_DE;CAJA_DE=null;asignarCaja(p,c);return}abrir(p);return}
  if(b.dataset.desde){F.desde=b.dataset.desde;dibujar();return}
  if(b.dataset.hacia){F.hacia=b.dataset.hacia;dibujar();return}
  if(b.dataset.q){const k=b.dataset.q[0]==='c'?'cajas':'sueltas';F[k]=Math.max(0,F[k]+(b.dataset.q[1]==='+'?1:-1));dibujar();return}
  switch(b.dataset.a){case 'close':close();break;case 'scanoff':stopScan();MODO_CAJA=null;close();break;case 'mango':{const v=$('man').value;found(v);break}
    case 'buscar':buscar();break;case 'cargacaja':MODO_CAJA=F.p;startScan().then(()=>{const m=$('smsg');if(m)m.textContent='📦 Escaneá el código de la CAJA de '+F.p.c});break;case 'guardar':guardar();break;
    case 'todo':{const d=locs(F.p).find(x=>x.u===F.desde);if(d&&d.q){F.cajas=F.p.u>1?Math.floor(d.q/F.p.u):0;F.sueltas=F.p.u>1?d.q%F.p.u:d.q;dibujar()}break}}
});
</script></body></html>
