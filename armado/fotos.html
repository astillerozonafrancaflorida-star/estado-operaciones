<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Fotos de productos</title>
<style>
:root{--bg:#F2F3EF;--sf:#fff;--fg:#1A211D;--mu:#5E6862;--ln:#D9DDD6;--ac:#1F5F8B;--wa:#9A6400}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{font-size:23px;margin:0}.mu{color:var(--mu);font-size:13px}a{color:var(--ac)}
.inp{border:1px solid var(--ln);border-radius:10px;padding:12px;font-size:17px;background:var(--sf);width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 12px;font-size:14px}
.chip[aria-pressed=true]{background:var(--fg);color:#fff;border-color:var(--fg)}
.p{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.p b{font-size:15px}.g{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.g a img{width:130px;height:130px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);background:#eee}
.sin{color:var(--wa);font-weight:700;font-size:13px}
</style></head><body><div class="wrap">
<a href="../app/" class="mu">← Inicio</a>
<h1>📸 Fotos de productos</h1>
<div class="mu">Fotos de etiqueta que sacan en el depósito (armado y ubicar). Buscá por código o nombre.</div>
<input id="q" class="inp" placeholder="Ej: 1390 o Taylor" autocomplete="off">
<div class="chips"><button class="chip" data-f="con" aria-pressed="true">Con fotos</button><button class="chip" data-f="sin" aria-pressed="false">Les faltan fotos</button></div>
<div id="res" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script src="fotos_productos.js"></script><script src="movdata.js"></script>
<script>
const FP=window.FP||{},M=window.MOV||{productos:[]};const B='https://raw.githubusercontent.com/astillerozonafrancaflorida-star/armados-fotos/main/PRODUCTOS-FOTOS/';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={};(M.productos||[]).forEach(p=>P[p.c]=p);Object.keys(FP).forEach(c=>{if(!P[c])P[c]={c,n:''}});
let FL='con';
const TIP=[['botella','🍾 Botella'],['codigo','▥ Código'],['caja','📦 Caja'],['otra','Otras']];
const fo=c=>{let o=FP[c]||{};if(Array.isArray(o))o={otra:o};return o};const nf=c=>Object.values(fo(c)).reduce((a,x)=>a+x.length,0);
const faltan=p=>['botella','codigo'].concat((p.u||1)>1?['caja']:[]).filter(t=>!(fo(p.c)[t]||[]).length);
function render(){const q=document.getElementById('q').value.trim().toLowerCase();
  let L=Object.values(P).filter(p=>!q||p.c.includes(q)||(p.n||'').toLowerCase().includes(q));
  L=L.filter(p=>FL==='con'?nf(p.c):faltan(p).length).sort((a,b)=>(a.n||'').localeCompare(b.n||''));
  document.getElementById('res').innerHTML=(L.length?`<div class="mu">${L.length} producto${L.length===1?'':'s'}</div>`:'<div class="mu">Sin resultados.</div>')+L.slice(0,150).map(p=>{const o=fo(p.c),fl=faltan(p);
    return `<div class="p"><b>${esc(p.c)}</b> ${esc(p.n)}${fl.length?`<div class="sin">Faltan: ${fl.map(t=>TIP.find(x=>x[0]===t)[1]).join(' · ')} (se piden al armar o ubicar)</div>`:''}
    ${TIP.filter(t=>(o[t[0]]||[]).length).map(t=>`<div class="mu" style="margin-top:6px">${t[1]}</div><div class="g">${o[t[0]].map(x=>`<a href="${B+encodeURIComponent(x)}" target="_blank"><img loading="lazy" src="${B+encodeURIComponent(x)}" alt="${esc(x)}"></a>`).join('')}</div>`).join('')}</div>`}).join('')}
document.getElementById('q').oninput=render;
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FL=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
render();
</script></body></html>
